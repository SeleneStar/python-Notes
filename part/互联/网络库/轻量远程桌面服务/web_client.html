<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>浏览器控制端</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#111; color:#eee; }
    header { padding:12px 16px; background:#1b1b1b; display:flex; gap:12px; align-items:center; }
    input, button { padding:6px 10px; }
    #videoBox { display:flex; justify-content:center; align-items:center; height: calc(100vh - 64px); }
    #stream { max-width: 100%; max-height: 100%; background:#000; }
    .muted { color:#aaa; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <div>状态: <span id="status">未连接</span></div>
    <div class="muted">将鼠标放在画面内进行操作；按键盘即可发送键盘事件。</div>
  </header>
  <div id="videoBox">
    <img id="stream" src="" alt="stream">
  </div>

  <script>
    function getQuery(k){return new URLSearchParams(location.search).get(k)||"";}
    const token = getQuery("token") || prompt("请输入访问密码(token):","123456") || "";
    const statusEl = document.getElementById("status");
    const imgEl = document.getElementById("stream");

    if(!token){ alert("缺少token"); }

    // 设置流地址
    imgEl.src = `/stream?token=${encodeURIComponent(token)}`;

    // WebSocket 连接
    let ws;
    function connectWS(){
      ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
      ws.onopen = ()=>{ statusEl.textContent = "已连接"; };
      ws.onclose = ()=>{ statusEl.textContent = "已断开"; setTimeout(connectWS, 1500); };
      ws.onerror = ()=>{ statusEl.textContent = "连接错误"; };
      ws.onmessage = (ev)=>{
        // 可处理 hello / pong / 其它消息
      };
    }
    connectWS();

    // 归一化坐标
    function normXY(evt){
      const rect = imgEl.getBoundingClientRect();
      const x = Math.min(Math.max(0, evt.clientX - rect.left), rect.width);
      const y = Math.min(Math.max(0, evt.clientY - rect.top), rect.height);
      const nx = rect.width ? x / rect.width : 0;
      const ny = rect.height ? y / rect.height : 0;
      return {nx, ny};
    }

    function send(obj){
      if(ws && ws.readyState === WebSocket.OPEN){
        ws.send(JSON.stringify(obj));
      }
    }

    // 鼠标事件
    imgEl.addEventListener("mousemove", (e)=>{
      const {nx, ny} = normXY(e);
      send({type:"mouse", act:"move", nx, ny});
    });
    imgEl.addEventListener("mousedown", (e)=>{
      const {nx, ny} = normXY(e);
      const btn = e.button===0?"left":(e.button===2?"right":"middle");
      send({type:"mouse", act:"down", btn, nx, ny});
    });
    imgEl.addEventListener("mouseup", (e)=>{
      const {nx, ny} = normXY(e);
      const btn = e.button===0?"left":(e.button===2?"right":"middle");
      send({type:"mouse", act:"up", btn, nx, ny});
    });
    imgEl.addEventListener("contextmenu", (e)=>{ e.preventDefault(); });

    // 键盘事件（页面全局）
    window.addEventListener("keydown", (e)=>{
      const map = {
        "Enter":"enter","Escape":"esc","Tab":"tab","Backspace":"backspace","Delete":"delete",
        "ArrowLeft":"left","ArrowRight":"right","ArrowUp":"up","ArrowDown":"down",
        "Shift":"shift","Control":"ctrl","Alt":"alt","Meta":"meta"
      };
      const key = map[e.key] || e.key;
      send({type:"key", act:"down", key});
      // 避免浏览器快捷键抢夺（按需屏蔽）
      if(["Tab"].includes(e.key)) e.preventDefault();
    }, true);
    window.addEventListener("keyup", (e)=>{
      const map = {
        "Enter":"enter","Escape":"esc","Tab":"tab","Backspace":"backspace","Delete":"delete",
        "ArrowLeft":"left","ArrowRight":"right","ArrowUp":"up","ArrowDown":"down",
        "Shift":"shift","Control":"ctrl","Alt":"alt","Meta":"meta"
      };
      const key = map[e.key] || e.key;
      send({type:"key", act:"up", key});
    }, true);
  </script>
</body>
</html>
